title: Thomas Yu
description: Personal website of Thomas Yu, PhD candidate in economics at Yale University. My research is in health economics and industrial organization.
url: "https://thomas-yu.com"
og_image: /assets/images/bio-photo.jpg
minimal_mistakes_skin: air
search: false
masthead_title: " " # hide the website title in the masthead
atom_feed:
  hide: true # hide the footer links
titles_from_headings:
  enabled: false # GitHub Pages plugin; it would also render the page's first heading as a title

remote_theme: "mmistakes/minimal-mistakes@4.28.1"

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-include-cache

author:
  name   : "Thomas Yu"
  avatar : "/assets/images/bio-photo.jpg"

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
